org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Debug builds (the Run button). Works on a USB-connected phone after:  adb reverse tcp:3000 tcp:3000
# On the Android EMULATOR use instead:  http://10.0.2.2:3000
# On a phone over the same Wi-Fi use:   http://<your-computer-IP>:3000
SMD_DEBUG_URL=http://localhost:3000

# Release builds: your hosted server (https only). Leave as is until you have hosting.
SMD_RELEASE_URL=https://YOUR-DOMAIN.example
